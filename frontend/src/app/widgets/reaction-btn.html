<div class="react-wrap"
     (mouseenter)="show.set(true)" (mouseleave)="show.set(false)">
  <button class="action" [class.liked]="post().liked" (click)="toggle()" title="React">
    @if (post().liked && emoji(post().my_reaction)) {
      <span class="my-reaction">{{ emoji(post().my_reaction) }}</span>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" [attr.fill]="post().liked ? 'currentColor' : 'none'"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    }
    <span>{{ post().likes_count }}</span>
  </button>

  @if (show()) {
    <div class="reaction-picker">
      @for (r of reactions; track r.kind) {
        <button class="reaction" [title]="r.label" (click)="react(r.kind)">
          {{ r.emoji }}
        </button>
      }
    </div>
  }
</div>
